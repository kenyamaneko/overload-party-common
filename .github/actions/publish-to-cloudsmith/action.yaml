name: Publish package to Cloudsmith
description: Exchange GitHub Actions OIDC for a Cloudsmith publisher API key and push the given NuGet/npm package.

inputs:
  format:
    description: Package format. "nuget" or "npm".
    required: true
  package-path:
    description: Path to the package artifact (.nupkg for nuget, .tgz or directory containing package.json for npm).
    required: true

runs:
  using: composite
  steps:
    - name: Validate format input
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
      run: |
        case "${FORMAT}" in
          nuget|npm)
            ;;
          *)
            echo "::error::format must be 'nuget' or 'npm' (got '${FORMAT}')"
            exit 1
            ;;
        esac

    - name: Exchange GitHub OIDC token for Cloudsmith publisher API key
      id: exchange
      shell: bash
      run: |
        github_token="$(curl -fsSL \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cloudsmith" | jq -r '.value')"

        payload="$(jq -nc \
          --arg token "${github_token}" \
          --arg slug "overload-party-publisher" \
          '{oidc_token: $token, service_slug: $slug}')"

        response="$(curl -fsSL -X POST \
          -H "Content-Type: application/json" \
          -d "${payload}" \
          "https://api.cloudsmith.io/openid/keyandnotes/")"

        cloudsmith_token="$(echo "${response}" | jq -r '.token')"
        if [ -z "${cloudsmith_token}" ] || [ "${cloudsmith_token}" = "null" ]; then
          echo "::error::Cloudsmith OIDC exchange did not return a token"
          exit 1
        fi
        echo "::add-mask::${cloudsmith_token}"
        echo "token=${cloudsmith_token}" >> "${GITHUB_OUTPUT}"

    - name: Push NuGet package to Cloudsmith
      if: inputs.format == 'nuget'
      shell: bash
      env:
        CLOUDSMITH_TOKEN: ${{ steps.exchange.outputs.token }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        dotnet nuget push "${PACKAGE_PATH}" \
          --source "https://nuget.cloudsmith.io/keyandnotes/overload-party-nuget/v3/index.json" \
          --api-key "${CLOUDSMITH_TOKEN}"

    - name: Publish npm package to Cloudsmith
      if: inputs.format == 'npm'
      shell: bash
      env:
        CLOUDSMITH_TOKEN: ${{ steps.exchange.outputs.token }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        {
          echo "//npm.cloudsmith.io/keyandnotes/overload-party-npm/:_authToken=${CLOUDSMITH_TOKEN}"
          echo "//npm.cloudsmith.io/keyandnotes/overload-party-npm/:always-auth=true"
        } >> "${HOME}/.npmrc"
        npm publish "${PACKAGE_PATH}" \
          --registry "https://npm.cloudsmith.io/keyandnotes/overload-party-npm/"
