name: C# test report
description: 'Summarize dotnet test TRX files into $GITHUB_STEP_SUMMARY and PR annotations.'

inputs:
  search-root:
    description: Directory to search recursively for *.trx files, relative to the repository root. A solution with multiple test projects produces one TRX per project, so all matches under this directory are aggregated.
    required: false
    default: '.'
  title:
    description: Heading used for the $GITHUB_STEP_SUMMARY section (e.g. 単体テスト結果).
    required: false
    default: テスト結果

runs:
  using: composite
  steps:
    - name: Summarize and annotate C# test results
      shell: bash
      env:
        SEARCH_ROOT: ${{ inputs.search-root }}
        TITLE: ${{ inputs.title }}
      run: dotnet run --project "${{ github.action_path }}/TestReport" -- "${GITHUB_WORKSPACE}/${SEARCH_ROOT}" "$TITLE"
