name: Deploy Cloud Run image
description: 'Resolve an already-pushed image tag to its digest and update an existing Cloud Run service to that digest. The service must have been created by terraform, which owns its configuration.'

inputs:
  service-name:
    description: Cloud Run service name.
    required: true
  image:
    description: Full image path excluding tag (e.g. asia-northeast1-docker.pkg.dev/keyandnotes-platform/overload-party/shop).
    required: true
  image-tag:
    description: Image tag to deploy (commit sha).
    required: true
  registry-project-id:
    description: Google Cloud project ID hosting the Artifact Registry repository.
    required: true
  project-id:
    description: Google Cloud project ID of the target environment.
    required: true
  region:
    description: Cloud Run region of the target environment.
    required: true

runs:
  using: composite
  steps:
    - name: Update Cloud Run service image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE: ${{ inputs.image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        REGISTRY_PROJECT_ID: ${{ inputs.registry-project-id }}
        PROJECT_ID: ${{ inputs.project-id }}
        REGION: ${{ inputs.region }}
      run: bash ${{ github.action_path }}/../../scripts/deploy-cloud-run-image/update-image.sh
