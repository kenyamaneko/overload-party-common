name: Build and push image
description: Build a Go service Docker image with the Cross-Repo Deps token mounted as a build secret, then push epoch-prefixed sha, sha, and latest tags to Artifact Registry.

inputs:
  image:
    description: Full image path excluding tag (e.g. asia-northeast1-docker.pkg.dev/keyandnotes-platform/overload-party/shop).
    required: true
  go-modules-token:
    description: Cross-Repo Deps App token used for private Go module resolution during the build.
    required: true

runs:
  using: composite
  steps:
    - name: Build and push image
      shell: bash
      env:
        DOCKER_BUILDKIT: "1"
        GO_MODULES_TOKEN: ${{ inputs.go-modules-token }}
        IMAGE: ${{ inputs.image }}
        GIT_SHA: ${{ github.sha }}
      run: ${{ github.action_path }}/build-and-push.sh
