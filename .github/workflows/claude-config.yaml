name: Claude Config

# claude/ 配下の検証と消費リポへの同期を 1 workflow で扱う。
# - validate: PR / push(main) で実行。skill frontmatter と @import パスを検証
# - sync: push(main) のみ。validate 成功後に消費リポへ自動 PR を作成
#
# 必要な Secret (sync 用): CLAUDE_SYNC_TOKEN
#   消費リポの Contents: write + Pull requests: write 権限を持つ PAT

on:
  push:
    branches: [main]
    paths:
      - "claude/**"
      - ".github/claude-consumers.yaml"
      - ".github/workflows/claude-config.yaml"
      - "scripts/claude-config/**"
  pull_request:
    paths:
      - "claude/**"
      - ".github/claude-consumers.yaml"
      - ".github/workflows/claude-config.yaml"
      - "scripts/claude-config/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill frontmatter
        run: python3 scripts/claude-config/validate_skill_frontmatter.py
      - name: Validate @import paths
        run: python3 scripts/claude-config/validate_import_paths.py

  load-consumers:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Read consumers
        id: read
        run: |
          set -e
          matrix=$(yq -o=json '.consumers' .github/claude-consumers.yaml | jq -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    needs: load-consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJson(needs.load-consumers.outputs.matrix) }}
    steps:
      - name: Checkout common
        uses: actions/checkout@v4
        with:
          path: common

      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.consumer.repo }}
          token: ${{ secrets.CLAUDE_SYNC_TOKEN }}
          path: consumer
          ref: ${{ matrix.consumer.target_branch }}

      - name: Read consumer manifest
        id: manifest
        working-directory: consumer
        run: |
          set -e
          if [ ! -f .claude-common.yaml ]; then
            echo "::warning::Consumer ${{ matrix.consumer.repo }} has no .claude-common.yaml; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          layers=$(yq -o=json '.layers' .claude-common.yaml | jq -r 'join(" ")')
          echo "layers=$layers" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Sync files
        if: steps.manifest.outputs.skip == 'false'
        run: bash common/scripts/claude-config/sync_files.sh common consumer "${{ steps.manifest.outputs.layers }}"

      - name: Create PR
        if: steps.manifest.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CLAUDE_SYNC_TOKEN }}
          path: consumer
          branch: chore/sync-claude-common
          base: ${{ matrix.consumer.target_branch }}
          title: "chore: sync claude config from overload-party-common"
          commit-message: "chore: sync claude config from overload-party-common"
          body: |
            Automated sync from `overload-party-common@${{ github.sha }}`.

            Layers applied: `${{ steps.manifest.outputs.layers }}`

            Triggered by [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          delete-branch: true
