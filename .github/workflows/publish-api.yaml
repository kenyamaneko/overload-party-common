name: Publish API Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/api-npm/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Check for changes since last publish
        id: check
        run: |
          LAST_TAG=$(git tag -l 'packages/api/v*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "First publish: no existing tags"
          elif ! git diff --quiet "$LAST_TAG" -- packages/api/ packages/api-npm/; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected since $LAST_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No changes since $LAST_TAG"
          fi

      - name: Compute version
        if: steps.check.outputs.publish == 'true'
        id: version
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          LAST_TAG=$(git tag -l 'packages/api/v*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="0.1.0"
          else
            CURRENT=$(echo "$LAST_TAG" | sed 's|packages/api/v||')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Tag Go module
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "packages/api/v${{ steps.version.outputs.version }}"
          git push origin "packages/api/v${{ steps.version.outputs.version }}"

      - name: Publish npm package
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/api-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          npm run build
          npm publish
