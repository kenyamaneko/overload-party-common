# パッケージを手動で publish する。
# GitHub Actions UI または gh workflow run で任意のブランチから実行可能。
name: Publish GameData Packages

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Check for changes since last publish
        id: check
        run: |
          LAST_TAG=$(git tag -l 'packages/gamedata/v*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "First publish: no existing tags"
          elif ! git diff --quiet "$LAST_TAG" -- packages/; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected since $LAST_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No changes since $LAST_TAG"
          fi

      - name: Compute version
        if: steps.check.outputs.publish == 'true'
        id: version
        run: |
          # Check ステップと同じタグパターンで最新タグを取得し patch +1
          LAST_TAG=$(git tag -l 'packages/gamedata/v*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="0.1.0"
          else
            CURRENT=$(echo "$LAST_TAG" | sed 's|packages/gamedata/v||')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Tag Go module
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "packages/gamedata/v${{ steps.version.outputs.version }}"
          git push origin "packages/gamedata/v${{ steps.version.outputs.version }}"

      - name: Publish NuGet package
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          npm run build
          npm publish
