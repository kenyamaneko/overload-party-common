name: Publish DevData Package

on:
  push:
    branches: [main]
    paths:
      - "packages/devdata/**"
      - "data/cards/**"
      - "data/products.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last publish
        id: check
        run: |
          LAST_TAG=$(git tag -l 'packages/devdata/v*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "First publish: no existing tags"
          elif ! git diff --quiet "$LAST_TAG" -- packages/devdata/; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected since $LAST_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No changes since $LAST_TAG"
          fi

      - name: Compute version
        if: steps.check.outputs.publish == 'true'
        id: version
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          LAST_TAG=$(git tag -l 'packages/devdata/v*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="0.1.0"
          else
            CURRENT=$(echo "$LAST_TAG" | sed 's|packages/devdata/v||')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Tag Go module
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "packages/devdata/v${{ steps.version.outputs.version }}"
          git push origin "packages/devdata/v${{ steps.version.outputs.version }}"
