# data/ または生成スクリプトが変更されたとき、gen/ の整合性を検証する。
name: Codegen Sync Check

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/generate_from_yaml.py"

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run code generation
        run: python3 scripts/generate_from_yaml.py --gen-dir gen/

      - name: Check for diffs
        run: |
          if ! git diff --exit-code -- gen/ docs/CARDS.md; then
            echo "::error::Generated files are out of sync. Run: python3 scripts/generate_from_yaml.py --gen-dir gen/"
            git diff --stat
            exit 1
          fi
