# data/ または生成スクリプトが変更されたとき、生成ファイルの整合性を検証する。
name: Codegen Sync Check

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run card generation
        run: python3 scripts/generate_cards.py

      - name: Run constants generation
        run: python3 scripts/generate_constants.py

      - name: Check for diffs
        run: |
          if ! git diff --exit-code -- packages/ docs/game_design/CARDS.md db/seed/cards_seed.sql; then
            echo "::error::Generated files are out of sync. Run: python3 scripts/generate_cards.py && python3 scripts/generate_constants.py"
            git diff --stat
            exit 1
          fi
