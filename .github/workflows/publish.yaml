name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - gamedata
          - api
          - devdata

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────��───────────────────────
  # 1. Detect changes & compute versions
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      gamedata: ${{ steps.detect.outputs.gamedata }}
      api: ${{ steps.detect.outputs.api }}
      devdata: ${{ steps.detect.outputs.devdata }}
      gamedata-version: ${{ steps.detect.outputs.gamedata-version }}
      api-version: ${{ steps.detect.outputs.api-version }}
      devdata-version: ${{ steps.detect.outputs.devdata-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and compute versions
        id: detect
        run: |
          TARGET="${{ inputs.target || 'auto' }}"
          BUMP="${{ inputs.bump || 'patch' }}"

          compute_version() {
            local prefix="$1" bump="$2"
            local last_tag
            last_tag=$(git tag -l "${prefix}/v*" | sort -V | tail -1)
            if [ -z "$last_tag" ]; then
              echo "0.1.0"
              return
            fi
            local current major minor patch
            current="${last_tag#"${prefix}/v"}"
            IFS='.' read -r major minor patch <<< "$current"
            case "$bump" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "${major}.$((minor + 1)).0" ;;
              *)     echo "${major}.${minor}.$((patch + 1))" ;;
            esac
          }

          has_changes() {
            local prefix="$1"
            shift
            local last_tag
            last_tag=$(git tag -l "${prefix}/v*" | sort -V | tail -1)
            if [ -z "$last_tag" ]; then
              return 0
            fi
            ! git diff --quiet "$last_tag" -- "$@"
          }

          GAMEDATA=false
          API=false
          DEVDATA=false

          if [ "$TARGET" = "auto" ]; then
            has_changes "packages/gamedata" packages/gamedata/ packages/gamedata-dotnet/ packages/gamedata-npm/ && GAMEDATA=true
            has_changes "packages/api" packages/api/ packages/api-npm/ && API=true
            has_changes "packages/devdata" packages/devdata/ && DEVDATA=true
          else
            case "$TARGET" in
              gamedata) GAMEDATA=true ;;
              api)      API=true ;;
              devdata)  DEVDATA=true ;;
            esac
          fi

          echo "gamedata=$GAMEDATA" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "devdata=$DEVDATA" >> "$GITHUB_OUTPUT"

          if [ "$GAMEDATA" = "true" ]; then
            VER=$(compute_version "packages/gamedata" "$BUMP")
            echo "gamedata-version=$VER" >> "$GITHUB_OUTPUT"
            echo "gamedata → v$VER"
          fi
          if [ "$API" = "true" ]; then
            VER=$(compute_version "packages/api" "$BUMP")
            echo "api-version=$VER" >> "$GITHUB_OUTPUT"
            echo "api → v$VER"
          fi
          if [ "$DEVDATA" = "true" ]; then
            VER=$(compute_version "packages/devdata" "$BUMP")
            echo "devdata-version=$VER" >> "$GITHUB_OUTPUT"
            echo "devdata → v$VER"
          fi

  # ──────────────────────────────────────────────
  # 2. Build & validate before publishing
  # ──────────────────────────────────────────────
  test:
    needs: check
    if: needs.check.outputs.gamedata == 'true' || needs.check.outputs.api == 'true' || needs.check.outputs.devdata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/gamedata/go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go vet
        run: |
          for mod in packages/gamedata packages/api packages/devdata; do
            echo "::group::go vet ${mod}"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done

      - name: .NET build
        working-directory: packages/gamedata-dotnet
        run: dotnet build -c Release --nologo -v quiet

      - name: Build gamedata-npm
        working-directory: packages/gamedata-npm
        run: |
          npm install
          npm run build

      - name: Type-check api-npm
        working-directory: packages/api-npm
        run: |
          npm install
          npx tsc --noEmit

  # ──────────────────────────────────────────────
  # 3. Publish gamedata (Go + NuGet + npm)
  #    Must complete before api (api-npm depends on gamedata-npm)
  # ──────────────────────────────────────────────
  publish-gamedata:
    needs: [check, test]
    if: needs.check.outputs.gamedata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish NuGet
        working-directory: packages/gamedata-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.check.outputs.gamedata-version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm
        working-directory: packages/gamedata-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.check.outputs.gamedata-version }} --no-git-tag-version
          npm run build
          npm publish

      - name: Tag Go module
        run: |
          git tag "packages/gamedata/v${{ needs.check.outputs.gamedata-version }}"
          git push origin "packages/gamedata/v${{ needs.check.outputs.gamedata-version }}"

  # ──────────────────────────────────────────────
  # 4. Publish api (Go + npm)
  #    Waits for gamedata to ensure registry dependency is available
  # ──────────────────────────────────────────────
  publish-api:
    needs: [check, test, publish-gamedata]
    if: |
      !failure() && !cancelled() &&
      needs.check.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish npm
        working-directory: packages/api-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace file: reference with registry dependency for CI build
          sed -i 's|"file:../gamedata-npm"|"*"|' package.json
          npm install
          npm version ${{ needs.check.outputs.api-version }} --no-git-tag-version
          npm run build
          npm publish

      - name: Tag Go module
        run: |
          git tag "packages/api/v${{ needs.check.outputs.api-version }}"
          git push origin "packages/api/v${{ needs.check.outputs.api-version }}"

  # ──────────────────────────────────────────────
  # 5. Publish devdata (Go tag only)
  # ──────────────────────────────────────────────
  publish-devdata:
    needs: [check, test]
    if: needs.check.outputs.devdata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go module
        run: |
          git tag "packages/devdata/v${{ needs.check.outputs.devdata-version }}"
          git push origin "packages/devdata/v${{ needs.check.outputs.devdata-version }}"
