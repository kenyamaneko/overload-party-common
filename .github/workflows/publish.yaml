name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - game-design-constants
          - game-logic-constants
          - ws-constants
          - shop-constants
          - newsfeed-constants
          - card-types
          - api-client
          - api-battle-rpc
          - devdata
          - gamedata-dotnet
          - game-design-constants-npm
          - game-logic-constants-npm
          - ws-constants-npm
          - shop-constants-npm
          - newsfeed-constants-npm
          - card-types-npm
          - game-state-npm
          - api-client-npm

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect changes & compute versions
  # ──────────────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      # Go modules
      game_design_constants: ${{ steps.detect.outputs.game_design_constants }}
      game_design_constants_version: ${{ steps.detect.outputs.game_design_constants_version }}
      game_logic_constants: ${{ steps.detect.outputs.game_logic_constants }}
      game_logic_constants_version: ${{ steps.detect.outputs.game_logic_constants_version }}
      ws_constants: ${{ steps.detect.outputs.ws_constants }}
      ws_constants_version: ${{ steps.detect.outputs.ws_constants_version }}
      shop_constants: ${{ steps.detect.outputs.shop_constants }}
      shop_constants_version: ${{ steps.detect.outputs.shop_constants_version }}
      newsfeed_constants: ${{ steps.detect.outputs.newsfeed_constants }}
      newsfeed_constants_version: ${{ steps.detect.outputs.newsfeed_constants_version }}
      card_types: ${{ steps.detect.outputs.card_types }}
      card_types_version: ${{ steps.detect.outputs.card_types_version }}
      api_client: ${{ steps.detect.outputs.api_client }}
      api_client_version: ${{ steps.detect.outputs.api_client_version }}
      api_battle_rpc: ${{ steps.detect.outputs.api_battle_rpc }}
      api_battle_rpc_version: ${{ steps.detect.outputs.api_battle_rpc_version }}
      devdata: ${{ steps.detect.outputs.devdata }}
      devdata_version: ${{ steps.detect.outputs.devdata_version }}
      # C# csproj
      gamedata_dotnet: ${{ steps.detect.outputs.gamedata_dotnet }}
      gamedata_dotnet_version: ${{ steps.detect.outputs.gamedata_dotnet_version }}
      # npm packages (Layer 1: independent)
      game_design_constants_npm: ${{ steps.detect.outputs.game_design_constants_npm }}
      game_design_constants_npm_version: ${{ steps.detect.outputs.game_design_constants_npm_version }}
      game_logic_constants_npm: ${{ steps.detect.outputs.game_logic_constants_npm }}
      game_logic_constants_npm_version: ${{ steps.detect.outputs.game_logic_constants_npm_version }}
      ws_constants_npm: ${{ steps.detect.outputs.ws_constants_npm }}
      ws_constants_npm_version: ${{ steps.detect.outputs.ws_constants_npm_version }}
      shop_constants_npm: ${{ steps.detect.outputs.shop_constants_npm }}
      shop_constants_npm_version: ${{ steps.detect.outputs.shop_constants_npm_version }}
      newsfeed_constants_npm: ${{ steps.detect.outputs.newsfeed_constants_npm }}
      newsfeed_constants_npm_version: ${{ steps.detect.outputs.newsfeed_constants_npm_version }}
      # npm packages (Layer 2: depends on Layer 1)
      card_types_npm: ${{ steps.detect.outputs.card_types_npm }}
      card_types_npm_version: ${{ steps.detect.outputs.card_types_npm_version }}
      game_state_npm: ${{ steps.detect.outputs.game_state_npm }}
      game_state_npm_version: ${{ steps.detect.outputs.game_state_npm_version }}
      # npm packages (Layer 3: depends on Layer 1/2)
      api_client_npm: ${{ steps.detect.outputs.api_client_npm }}
      api_client_npm_version: ${{ steps.detect.outputs.api_client_npm_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and compute versions
        id: detect
        run: bash scripts/ci/detect-changes.sh "${{ inputs.target || 'auto' }}" "${{ inputs.bump || 'patch' }}"

  # ──────────────────────────────────────────────
  # 2. Build & validate before publishing
  # ──────────────────────────────────────────────
  build:
    name: Build & validate
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/game-design-constants/go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go vet + build (all modules)
        run: |
          for mod in packages/game-design-constants packages/game-logic-constants packages/ws-constants packages/shop-constants packages/newsfeed-constants packages/card-types packages/api-client packages/api-battle-rpc packages/devdata; do
            echo "::group::go vet $mod"
            (cd "$mod" && go vet ./... && go build ./...)
            echo "::endgroup::"
          done

      - name: .NET build
        working-directory: packages/gamedata-dotnet
        run: dotnet build -c Release --nologo -v quiet

      # npm packages are built in layer order so downstream packages can resolve
      # dependency type declarations via "file:.." references during local tsc.
      - name: Build npm packages (Layer 1 → Layer 2 → Layer 3)
        run: |
          for pkg in \
            game-design-constants-npm \
            game-logic-constants-npm \
            ws-constants-npm \
            shop-constants-npm \
            newsfeed-constants-npm \
            card-types-npm \
            game-state-npm \
            api-client-npm; do
            echo "::group::build $pkg"
            (cd "packages/$pkg" && npm install && npm run build)
            echo "::endgroup::"
          done

  # ──────────────────────────────────────────────
  # 3. Publish Go modules (tag only — go get resolves via git tag)
  #    All Go modules are independent; no publish ordering needed.
  # ──────────────────────────────────────────────
  publish-go:
    name: Publish Go modules
    needs: [detect, build]
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go modules
        run: |
          declare -A MODULES=(
            [game-design-constants]="${{ needs.detect.outputs.game_design_constants }}:${{ needs.detect.outputs.game_design_constants_version }}"
            [game-logic-constants]="${{ needs.detect.outputs.game_logic_constants }}:${{ needs.detect.outputs.game_logic_constants_version }}"
            [ws-constants]="${{ needs.detect.outputs.ws_constants }}:${{ needs.detect.outputs.ws_constants_version }}"
            [shop-constants]="${{ needs.detect.outputs.shop_constants }}:${{ needs.detect.outputs.shop_constants_version }}"
            [newsfeed-constants]="${{ needs.detect.outputs.newsfeed_constants }}:${{ needs.detect.outputs.newsfeed_constants_version }}"
            [card-types]="${{ needs.detect.outputs.card_types }}:${{ needs.detect.outputs.card_types_version }}"
            [api-client]="${{ needs.detect.outputs.api_client }}:${{ needs.detect.outputs.api_client_version }}"
            [api-battle-rpc]="${{ needs.detect.outputs.api_battle_rpc }}:${{ needs.detect.outputs.api_battle_rpc_version }}"
            [devdata]="${{ needs.detect.outputs.devdata }}:${{ needs.detect.outputs.devdata_version }}"
          )
          for name in "${!MODULES[@]}"; do
            IFS=':' read -r changed ver <<< "${MODULES[$name]}"
            if [ "$changed" = "true" ]; then
              tag="packages/$name/v$ver"
              echo "Tagging $tag"
              git tag "$tag"
              git push origin "$tag"
            fi
          done

  # ──────────────────────────────────────────────
  # 4. Publish gamedata-dotnet (NuGet)
  # ──────────────────────────────────────────────
  publish-gamedata-dotnet:
    name: Publish gamedata-dotnet
    needs: [detect, build]
    if: needs.detect.outputs.gamedata_dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish NuGet
        working-directory: packages/gamedata-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.detect.outputs.gamedata_dotnet_version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        run: |
          git tag "packages/gamedata-dotnet/v${{ needs.detect.outputs.gamedata_dotnet_version }}"
          git push origin "packages/gamedata-dotnet/v${{ needs.detect.outputs.gamedata_dotnet_version }}"

  # ──────────────────────────────────────────────
  # 5. Publish npm Layer 1 (independent packages — parallel)
  # ──────────────────────────────────────────────
  publish-game-design-constants-npm:
    name: Publish game-design-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/game-design-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.game_design_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/game-design-constants-npm/v${{ needs.detect.outputs.game_design_constants_npm_version }}"
          git push origin "packages/game-design-constants-npm/v${{ needs.detect.outputs.game_design_constants_npm_version }}"

  publish-game-logic-constants-npm:
    name: Publish game-logic-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.game_logic_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/game-logic-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.game_logic_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/game-logic-constants-npm/v${{ needs.detect.outputs.game_logic_constants_npm_version }}"
          git push origin "packages/game-logic-constants-npm/v${{ needs.detect.outputs.game_logic_constants_npm_version }}"

  publish-ws-constants-npm:
    name: Publish ws-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.ws_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/ws-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.ws_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/ws-constants-npm/v${{ needs.detect.outputs.ws_constants_npm_version }}"
          git push origin "packages/ws-constants-npm/v${{ needs.detect.outputs.ws_constants_npm_version }}"

  publish-shop-constants-npm:
    name: Publish shop-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.shop_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/shop-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.shop_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/shop-constants-npm/v${{ needs.detect.outputs.shop_constants_npm_version }}"
          git push origin "packages/shop-constants-npm/v${{ needs.detect.outputs.shop_constants_npm_version }}"

  publish-newsfeed-constants-npm:
    name: Publish newsfeed-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.newsfeed_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/newsfeed-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.newsfeed_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/newsfeed-constants-npm/v${{ needs.detect.outputs.newsfeed_constants_npm_version }}"
          git push origin "packages/newsfeed-constants-npm/v${{ needs.detect.outputs.newsfeed_constants_npm_version }}"

  # ──────────────────────────────────────────────
  # 6. Publish npm Layer 2 (card-types / game-state — depend on Layer 1)
  #    Wait for Layer 1 so GitHub Packages can resolve the dependencies.
  # ──────────────────────────────────────────────
  publish-card-types-npm:
    name: Publish card-types-npm
    needs:
      - detect
      - build
      - publish-game-design-constants-npm
      - publish-game-logic-constants-npm
      - publish-ws-constants-npm
      - publish-shop-constants-npm
      - publish-newsfeed-constants-npm
    if: |
      !failure() && !cancelled() &&
      needs.detect.outputs.card_types_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/card-types-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace any file: references with registry "*" so npm resolves
          # against GitHub Packages during the publish build.
          sed -i 's|"file:\.\./[^"]*"|"*"|g' package.json
          npm install
          npm version ${{ needs.detect.outputs.card_types_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/card-types-npm/v${{ needs.detect.outputs.card_types_npm_version }}"
          git push origin "packages/card-types-npm/v${{ needs.detect.outputs.card_types_npm_version }}"

  publish-game-state-npm:
    name: Publish game-state-npm
    needs:
      - detect
      - build
      - publish-game-design-constants-npm
      - publish-game-logic-constants-npm
      - publish-ws-constants-npm
      - publish-shop-constants-npm
      - publish-newsfeed-constants-npm
    if: |
      !failure() && !cancelled() &&
      needs.detect.outputs.game_state_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/game-state-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i 's|"file:\.\./[^"]*"|"*"|g' package.json
          npm install
          npm version ${{ needs.detect.outputs.game_state_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/game-state-npm/v${{ needs.detect.outputs.game_state_npm_version }}"
          git push origin "packages/game-state-npm/v${{ needs.detect.outputs.game_state_npm_version }}"

  # ──────────────────────────────────────────────
  # 7. Publish npm Layer 3 (api-client — depends on Layer 1 + Layer 2)
  # ──────────────────────────────────────────────
  publish-api-client-npm:
    name: Publish api-client-npm
    needs:
      - detect
      - build
      - publish-game-design-constants-npm
      - publish-game-logic-constants-npm
      - publish-ws-constants-npm
      - publish-shop-constants-npm
      - publish-newsfeed-constants-npm
      - publish-card-types-npm
      - publish-game-state-npm
    if: |
      !failure() && !cancelled() &&
      needs.detect.outputs.api_client_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Publish npm
        working-directory: packages/api-client-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i 's|"file:\.\./[^"]*"|"*"|g' package.json
          npm install
          npm version ${{ needs.detect.outputs.api_client_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/api-client-npm/v${{ needs.detect.outputs.api_client_npm_version }}"
          git push origin "packages/api-client-npm/v${{ needs.detect.outputs.api_client_npm_version }}"
