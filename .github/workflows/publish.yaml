name: Publish Packages

# game-design-constants (Go module + NuGet + npm) を publish する。

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - game-design-constants
          - game-design-constants-dotnet
          - game-design-constants-npm
          - pubsub-events

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect changes & compute versions
  # ──────────────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      game_design_constants: ${{ steps.detect.outputs.game_design_constants }}
      game_design_constants_version: ${{ steps.detect.outputs.game_design_constants_version }}
      game_design_constants_dotnet: ${{ steps.detect.outputs.game_design_constants_dotnet }}
      game_design_constants_dotnet_version: ${{ steps.detect.outputs.game_design_constants_dotnet_version }}
      game_design_constants_npm: ${{ steps.detect.outputs.game_design_constants_npm }}
      game_design_constants_npm_version: ${{ steps.detect.outputs.game_design_constants_npm_version }}
      pubsub_events: ${{ steps.detect.outputs.pubsub_events }}
      pubsub_events_version: ${{ steps.detect.outputs.pubsub_events_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and compute versions
        id: detect
        run: bash scripts/ci/detect-changes.sh "${{ inputs.target || 'auto' }}" "${{ inputs.bump || 'patch' }}"

  # ──────────────────────────────────────────────
  # 2. Build & validate before publishing
  # ──────────────────────────────────────────────
  build:
    name: Build & validate
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/game-design-constants/go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go vet + build (game-design-constants)
        run: |
          cd packages/game-design-constants
          go vet ./...
          go build ./...

      - name: Go vet + build (pubsub-events)
        run: |
          cd packages/pubsub-events
          go vet ./...
          go build ./...

      - name: .NET build
        run: |
          cd packages/game-design-constants-dotnet
          dotnet build -c Release --nologo -v quiet

      - name: Build npm package
        run: |
          cd packages/game-design-constants-npm
          npm install
          npm run build

  # ──────────────────────────────────────────────
  # 3. Publish Go module (tag only — go get resolves via git tag)
  # ──────────────────────────────────────────────
  publish-go:
    name: Publish game-design-constants (Go)
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go module
        run: |
          tag="packages/game-design-constants/v${{ needs.detect.outputs.game_design_constants_version }}"
          git tag "$tag"
          git push origin "$tag"

  publish-pubsub-events-go:
    name: Publish pubsub-events (Go)
    needs: [detect, build]
    if: needs.detect.outputs.pubsub_events == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go module
        run: |
          tag="packages/pubsub-events/v${{ needs.detect.outputs.pubsub_events_version }}"
          git tag "$tag"
          git push origin "$tag"

  # ──────────────────────────────────────────────
  # 4. Publish C# csproj (NuGet)
  # ──────────────────────────────────────────────
  publish-game-design-constants-dotnet:
    name: Publish game-design-constants-dotnet
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants_dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish NuGet
        working-directory: packages/game-design-constants-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.detect.outputs.game_design_constants_dotnet_version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          git tag "packages/game-design-constants-dotnet/v${{ needs.detect.outputs.game_design_constants_dotnet_version }}"
          git push origin "packages/game-design-constants-dotnet/v${{ needs.detect.outputs.game_design_constants_dotnet_version }}"

  # ──────────────────────────────────────────────
  # 5. Publish npm package
  # ──────────────────────────────────────────────
  publish-game-design-constants-npm:
    name: Publish game-design-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kenyamaneko"
      - name: Publish npm
        working-directory: packages/game-design-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.game_design_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/game-design-constants-npm/v${{ needs.detect.outputs.game_design_constants_npm_version }}"
          git push origin "packages/game-design-constants-npm/v${{ needs.detect.outputs.game_design_constants_npm_version }}"
