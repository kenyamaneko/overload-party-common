name: Publish Packages

# game-design-constants (Go module + NuGet + npm) を publish する。

# 桁は後方互換を壊すかどうかの判断であり変更内容から導けないため、人が選んで実行する。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - game-design-constants
          - game-design-constants-dotnet
          - game-design-constants-npm

concurrency:
  group: publish-${{ github.ref }}
  # タグの採番が競合しないように、先行ジョブの完了を待つ
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect changes & compute versions
  # ──────────────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      game_design_constants: ${{ steps.detect.outputs.game_design_constants }}
      game_design_constants_version: ${{ steps.detect.outputs.game_design_constants_version }}
      game_design_constants_dotnet: ${{ steps.detect.outputs.game_design_constants_dotnet }}
      game_design_constants_dotnet_version: ${{ steps.detect.outputs.game_design_constants_dotnet_version }}
      game_design_constants_npm: ${{ steps.detect.outputs.game_design_constants_npm }}
      game_design_constants_npm_version: ${{ steps.detect.outputs.game_design_constants_npm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and compute versions
        id: detect
        run: bash .github/scripts/publish/detect-changes.sh "${{ inputs.target }}" "${{ inputs.bump }}"

  # ──────────────────────────────────────────────
  # 2. Build & validate before publishing
  # ──────────────────────────────────────────────
  build:
    name: Build & validate
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/game-design-constants/go.mod

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vet game-design-constants
        run: go vet ./...
        working-directory: packages/game-design-constants

      - name: Build game-design-constants
        run: go build ./...
        working-directory: packages/game-design-constants

      - name: .NET build
        run: dotnet build -c Release --nologo -v quiet
        working-directory: packages/game-design-constants-dotnet

      - name: Install npm dependencies
        run: npm install
        working-directory: packages/game-design-constants-npm

      - name: Build npm package
        run: npm run build
        working-directory: packages/game-design-constants-npm

  # ──────────────────────────────────────────────
  # 3. Publish Go module (tag only — go get resolves via git tag)
  # ──────────────────────────────────────────────
  publish-go:
    name: Publish game-design-constants (Go)
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag Go module
        env:
          PACKAGE: game-design-constants
          VERSION: ${{ needs.detect.outputs.game_design_constants_version }}
        run: .github/scripts/publish/tag-package.sh

  # ──────────────────────────────────────────────
  # 4. Publish C# csproj (NuGet)
  # ──────────────────────────────────────────────
  publish-game-design-constants-dotnet:
    name: Publish game-design-constants-dotnet
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants_dotnet == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack game-design-constants-dotnet
        working-directory: packages/game-design-constants-dotnet
        run: dotnet pack -c Release -p:Version=${{ needs.detect.outputs.game_design_constants_dotnet_version }} -o ./nupkg
      - name: Publish to Cloudsmith
        uses: kenyamaneko/overload-party-common/.github/actions/publish-to-cloudsmith@main
        with:
          format: nuget
          package-path: packages/game-design-constants-dotnet/nupkg/OverloadParty.GameDesignConstants.${{ needs.detect.outputs.game_design_constants_dotnet_version }}.nupkg
      - name: Tag
        env:
          PACKAGE: game-design-constants-dotnet
          VERSION: ${{ needs.detect.outputs.game_design_constants_dotnet_version }}
        run: .github/scripts/publish/tag-package.sh

  # ──────────────────────────────────────────────
  # 5. Publish npm package
  # ──────────────────────────────────────────────
  publish-game-design-constants-npm:
    name: Publish game-design-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.game_design_constants_npm == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build & version npm package
        working-directory: packages/game-design-constants-npm
        env:
          VERSION: ${{ needs.detect.outputs.game_design_constants_npm_version }}
        run: ../../.github/scripts/publish/build-and-version-npm.sh
      - name: Publish to Cloudsmith
        uses: kenyamaneko/overload-party-common/.github/actions/publish-to-cloudsmith@main
        with:
          format: npm
          package-path: packages/game-design-constants-npm
      - name: Tag
        env:
          PACKAGE: game-design-constants-npm
          VERSION: ${{ needs.detect.outputs.game_design_constants_npm_version }}
        run: .github/scripts/publish/tag-package.sh
