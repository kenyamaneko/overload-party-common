name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - gamedata
          - api
          - devdata

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect changes & compute versions
  # ──────────────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      gamedata: ${{ steps.detect.outputs.gamedata }}
      api: ${{ steps.detect.outputs.api }}
      devdata: ${{ steps.detect.outputs.devdata }}
      gamedata-version: ${{ steps.detect.outputs.gamedata-version }}
      api-version: ${{ steps.detect.outputs.api-version }}
      devdata-version: ${{ steps.detect.outputs.devdata-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and compute versions
        id: detect
        run: bash scripts/ci/detect-changes.sh "${{ inputs.target || 'auto' }}" "${{ inputs.bump || 'patch' }}"

  # ──────────────────────────────────────────────
  # 2. Build & validate before publishing
  # ──────────────────────────────────────────────
  build:
    name: Build & validate
    needs: detect
    if: needs.detect.outputs.gamedata == 'true' || needs.detect.outputs.api == 'true' || needs.detect.outputs.devdata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/gamedata/go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go vet
        run: |
          for mod in packages/gamedata packages/api packages/devdata; do
            echo "::group::go vet ${mod}"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done

      - name: .NET build
        working-directory: packages/gamedata-dotnet
        run: dotnet build -c Release --nologo -v quiet

      - name: Build gamedata-npm
        working-directory: packages/gamedata-npm
        run: |
          npm install
          npm run build

      - name: Type-check api-npm
        working-directory: packages/api-npm
        run: |
          npm install
          npx tsc --noEmit

  # ──────────────────────────────────────────────
  # 3. Publish gamedata (Go + NuGet + npm)
  #    Must complete before api (api-npm depends on gamedata-npm)
  # ──────────────────────────────────────────────
  publish-gamedata:
    name: Publish gamedata
    needs: [detect, build]
    if: needs.detect.outputs.gamedata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish NuGet
        working-directory: packages/gamedata-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.detect.outputs.gamedata-version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm (gamedata)
        working-directory: packages/gamedata-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm version ${{ needs.detect.outputs.gamedata-version }} --no-git-tag-version
          npm run build
          npm publish

      - name: Tag Go module (gamedata)
        run: |
          git tag "packages/gamedata/v${{ needs.detect.outputs.gamedata-version }}"
          git push origin "packages/gamedata/v${{ needs.detect.outputs.gamedata-version }}"

  # ──────────────────────────────────────────────
  # 4. Publish api (Go + npm)
  #    Waits for gamedata to ensure registry dependency is available
  # ──────────────────────────────────────────────
  publish-api:
    name: Publish api
    needs: [detect, build, publish-gamedata]
    if: |
      !failure() && !cancelled() &&
      needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish npm (api)
        working-directory: packages/api-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace file: reference with registry dependency for CI build
          sed -i 's|"file:../gamedata-npm"|"*"|' package.json
          npm install
          npm version ${{ needs.detect.outputs.api-version }} --no-git-tag-version
          npm run build
          npm publish

      - name: Tag Go module (api)
        run: |
          git tag "packages/api/v${{ needs.detect.outputs.api-version }}"
          git push origin "packages/api/v${{ needs.detect.outputs.api-version }}"

  # ──────────────────────────────────────────────
  # 5. Publish devdata (Go tag only)
  # ──────────────────────────────────────────────
  publish-devdata:
    name: Publish devdata
    needs: [detect, build]
    if: needs.detect.outputs.devdata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go module (devdata)
        run: |
          git tag "packages/devdata/v${{ needs.detect.outputs.devdata-version }}"
          git push origin "packages/devdata/v${{ needs.detect.outputs.devdata-version }}"
