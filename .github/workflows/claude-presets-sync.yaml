name: Claude Presets Sync

# presets/claude/ 配下の変更を消費リポに同期する。
# 消費リポリスト: presets/claude/.consumers.yaml
# 各消費リポは .claude/docs.yaml で適用レイヤを宣言する。
#
# 必要な Secret: CLAUDE_SYNC_TOKEN
#   消費リポの Contents: write + Pull requests: write 権限を持つ PAT

on:
  push:
    branches: [main]
    paths:
      - "presets/claude/**"
      - ".github/workflows/claude-presets-sync.yaml"
      - ".github/scripts/claude-presets/**"
  workflow_dispatch:

jobs:
  load-consumers:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout common
        uses: actions/checkout@v4

      - name: Read consumers
        id: read
        run: |
          set -e
          matrix=$(yq -o=json '.consumers' presets/claude/.consumers.yaml | jq -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    needs: load-consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJson(needs.load-consumers.outputs.matrix) }}
    steps:
      - name: Checkout common
        uses: actions/checkout@v4
        with:
          path: common

      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.consumer.repo }}
          token: ${{ secrets.CLAUDE_SYNC_TOKEN }}
          path: consumer
          ref: ${{ matrix.consumer.target_branch }}

      - name: Read consumer manifest
        id: manifest
        run: bash common/.github/scripts/claude-presets/read_consumer_manifest.sh consumer "${{ matrix.consumer.repo }}"

      - name: Sync files
        if: steps.manifest.outputs.skip == 'false'
        run: bash common/.github/scripts/claude-presets/sync_files.sh common consumer "${{ steps.manifest.outputs.layers }}"

      - name: Create PR
        if: steps.manifest.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CLAUDE_SYNC_TOKEN }}
          path: consumer
          branch: chore/sync-claude-presets
          base: ${{ matrix.consumer.target_branch }}
          title: "chore: sync claude presets from overload-party-common"
          commit-message: "chore: sync claude presets from overload-party-common"
          body: |
            Automated sync from `overload-party-common@${{ github.sha }}`.

            Layers applied: `${{ steps.manifest.outputs.layers }}`

            Triggered by [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          delete-branch: true
