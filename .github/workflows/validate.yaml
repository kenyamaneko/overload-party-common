name: Validate

# game-design-constants の codegen-sync check + unit tests、テスト観点カタログの公開。

on:
  push:
    branches: [main]
    paths:
      - "data/game_design_constants.yaml"
      - "data/factions.yaml"
      - "scripts/**"
      - "packages/game-design-constants/**"
      - "packages/game-design-constants-dotnet/**"
      - "packages/game-design-constants-npm/**"
      - "packages/doc-tools/**"
      - "packages/codegen-tools/**"
      - "packages/asyncapi-codegen-tools/**"
      - ".github/actions/test-catalog/**"
      - ".github/workflows/validate.yaml"
      - "docs/pages/**"
  pull_request:
    paths:
      - "data/game_design_constants.yaml"
      - "data/factions.yaml"
      - "scripts/**"
      - "packages/game-design-constants/**"
      - "packages/game-design-constants-dotnet/**"
      - "packages/game-design-constants-npm/**"
      - "packages/doc-tools/**"
      - "packages/codegen-tools/**"
      - "packages/asyncapi-codegen-tools/**"
      - ".github/actions/test-catalog/**"
      - ".github/workflows/validate.yaml"
      - "docs/pages/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main の run は GitHub Pages への deploy を含むため、後続の push で打ち切らない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests (Python)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install pyyaml pytest
      - name: Install doc-tools
        run: pip install -e packages/doc-tools
      - name: Install codegen-tools
        run: pip install -e packages/codegen-tools
      # codegen-tools に依存し PyPI には無いため、codegen-tools を入れた後に install する。
      - name: Install asyncapi-codegen-tools
        run: pip install -e packages/asyncapi-codegen-tools
      # 同一起動でまとめて実行すると別パッケージの tests モジュールが衝突するため、パッケージ単位に分割する。
      - name: Run tests (scripts)
        run: python3 -m pytest scripts/ -v --junitxml=pytest-scripts.xml
      - name: Report test results (scripts)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-test-report
        with:
          xml-path: pytest-scripts.xml
          title: scripts テスト結果
      - name: Run tests (doc-tools)
        run: python3 -m pytest packages/doc-tools/tests/ -v --junitxml=pytest-doc-tools.xml
      - name: Report test results (doc-tools)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-test-report
        with:
          xml-path: pytest-doc-tools.xml
          title: doc-tools テスト結果
      - name: Run tests (codegen-tools)
        run: python3 -m pytest packages/codegen-tools/tests/ -v --junitxml=pytest-codegen-tools.xml
      - name: Report test results (codegen-tools)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-test-report
        with:
          xml-path: pytest-codegen-tools.xml
          title: codegen-tools テスト結果
      - name: Run tests (asyncapi-codegen-tools)
        run: python3 -m pytest packages/asyncapi-codegen-tools/tests/ -v --junitxml=pytest-asyncapi-codegen-tools.xml
      - name: Report test results (asyncapi-codegen-tools)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-test-report
        with:
          xml-path: pytest-asyncapi-codegen-tools.xml
          title: asyncapi-codegen-tools テスト結果
      - name: Upload test results
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-*.xml
          retention-days: 1

  publish-catalog:
    name: Publish test viewpoint catalog
    needs: unit-tests
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: pytest-results
      - name: Render test viewpoint catalog
        uses: ./.github/actions/test-catalog
        with:
          title: common テスト観点カタログ
          output-dir: _site/catalog
          sections: |
            外から見た振る舞い:ゲーム定数の生成:pytest-junit:pytest-scripts.xml
            外から見た振る舞い:ドキュメント生成:pytest-junit:pytest-doc-tools.xml:tests.test_generate_api_docs,tests.test_generate_schema_doc,tests.test_generate_test_catalog
            外から見た振る舞い:コード生成:pytest-junit:pytest-codegen-tools.xml:tests.test_runner
            外から見た振る舞い:AsyncAPI からのコード生成:pytest-junit:pytest-asyncapi-codegen-tools.xml:tests.test_runner
            内部の挙動:ドキュメント生成の内部部品:pytest-junit:pytest-doc-tools.xml:tests.test_utils
            内部の挙動:コード生成の内部部品:pytest-junit:pytest-codegen-tools.xml:tests.test_go_emitter,tests.test_yaml_loader
            内部の挙動:AsyncAPI コード生成の内部部品:pytest-junit:pytest-asyncapi-codegen-tools.xml:tests.test_parser
      - name: Place cross-repo index page
        run: cp docs/pages/index.html _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  codegen-sync:
    name: Codegen sync check
    needs: unit-tests
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install pyyaml
      - name: Install doc-tools
        run: pip install -e packages/doc-tools

      - name: Generate game-design constants
        run: python3 scripts/generate_constants.py

      - name: Verify no diff
        run: .github/scripts/validate/verify-no-generated-diff.sh
