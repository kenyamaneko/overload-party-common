name: Validate

# game-design-constants の codegen-sync check + unit tests。

on:
  push:
    branches: [main]
    paths:
      - "data/game_design_constants.yaml"
      - "data/factions.yaml"
      - "scripts/generate_constants.py"
      - "scripts/test_generate_constants.py"
      - "packages/game-design-constants/**"
      - "packages/game-design-constants-dotnet/**"
      - "packages/game-design-constants-npm/**"
      - "packages/doc-tools/**"
      - "packages/codegen-tools/**"
  pull_request:
    paths:
      - "data/game_design_constants.yaml"
      - "data/factions.yaml"
      - "scripts/generate_constants.py"
      - "scripts/test_generate_constants.py"
      - "packages/game-design-constants/**"
      - "packages/game-design-constants-dotnet/**"
      - "packages/game-design-constants-npm/**"
      - "packages/doc-tools/**"
      - "packages/codegen-tools/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install pyyaml pytest
      - name: Install doc-tools
        run: pip install -e packages/doc-tools
      - name: Install codegen-tools
        run: pip install -e packages/codegen-tools
      # 同一起動でまとめて実行すると別パッケージの tests モジュールが衝突するため、パッケージ単位に分割する。
      - name: Run tests (scripts)
        run: python3 -m pytest scripts/ -v
      - name: Run tests (doc-tools)
        run: python3 -m pytest packages/doc-tools/tests/ -v
      - name: Run tests (codegen-tools)
        run: python3 -m pytest packages/codegen-tools/tests/ -v

  codegen-sync:
    name: Codegen sync check
    needs: unit-tests
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install pyyaml
      - name: Install doc-tools
        run: pip install -e packages/doc-tools

      - name: Generate game-design constants
        run: python3 scripts/generate_constants.py

      - name: Verify no diff
        run: |
          if ! git diff --exit-code -- packages/game-design-constants/ packages/game-design-constants-dotnet/ packages/game-design-constants-npm/; then
            echo "::error::Generated files are out of sync. Run generate scripts and commit."
            git diff --stat
            exit 1
          fi
