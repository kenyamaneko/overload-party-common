name: Validate

# game-design-constants の codegen-sync check + unit tests。

on:
  push:
    branches: [main]
    paths:
      - "data/game_design_constants.yaml"
      - "data/factions.yaml"
      - "db/schema_postgres.sql"
      - "scripts/generate_constants.py"
      - "scripts/generate_schema_doc.py"
      - "scripts/test_generate_constants.py"
      - "packages/game-design-constants/**"
      - "packages/game-design-constants-dotnet/**"
      - "packages/game-design-constants-npm/**"
      - "packages/doc-tools/**"
      - "docs/architecture/DATA_DESIGN.md"
  pull_request:
    paths:
      - "data/game_design_constants.yaml"
      - "data/factions.yaml"
      - "db/schema_postgres.sql"
      - "scripts/generate_constants.py"
      - "scripts/generate_schema_doc.py"
      - "scripts/test_generate_constants.py"
      - "packages/game-design-constants/**"
      - "packages/game-design-constants-dotnet/**"
      - "packages/game-design-constants-npm/**"
      - "packages/doc-tools/**"
      - "docs/architecture/DATA_DESIGN.md"

jobs:
  unit-tests:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Install doc-tools
        run: pip install -e packages/doc-tools
      - name: Run tests
        run: python3 -m pytest scripts/ packages/doc-tools/tests/ -v

  codegen-sync:
    name: Codegen sync check
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install doc-tools
        run: pip install -e packages/doc-tools

      - name: Generate game-design constants
        run: python3 scripts/generate_constants.py

      - name: Generate schema docs
        run: python3 scripts/generate_schema_doc.py

      - name: Verify no diff
        run: |
          if ! git diff --exit-code -- packages/game-design-constants/ packages/game-design-constants-dotnet/ packages/game-design-constants-npm/ docs/architecture/DATA_DESIGN.md; then
            echo "::error::Generated files are out of sync. Run generate scripts and commit."
            git diff --stat
            exit 1
          fi
