name: Dispatch DB Migration

on:
  push:
    branches: [main]
    paths:
      - "db/schema_postgres.sql"
      - "db/grant_iam.sql"

jobs:
  dispatch:
    name: Trigger ops migration
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to ops repo
        run: |
          gh api repos/kenyamaneko/overload-party-ops/dispatches \
            -f event_type=db-migrate \
            -f 'client_payload[sha]=${{ github.sha }}'
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
