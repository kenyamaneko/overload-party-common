# db/schema_postgres.sql を Cloud SQL (dev) に自動適用する。
# db-migrate イメージをビルドし、Cloud Run Job 経由で
# Direct VPC Egress → プライベート IP で Cloud SQL に接続する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write      # Workload Identity Federation

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/overload-party-shared/overload-party/db-migrate

jobs:
  db-migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push migration image
        run: |
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest db/
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Ensure Cloud SQL instance is running
        run: |
          PROJECT=$(echo "${{ secrets.CLOUDSQL_CONNECTION_NAME }}" | cut -d: -f1)
          gcloud sql instances patch ${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
            --project="$PROJECT" --activation-policy=ALWAYS --quiet
          echo "Waiting for instance to become RUNNABLE..."
          for i in $(seq 1 60); do
            STATE=$(gcloud sql instances describe ${{ secrets.CLOUDSQL_INSTANCE_NAME }} --project="$PROJECT" --format='value(state)')
            if [ "$STATE" = "RUNNABLE" ]; then
              echo "Instance is RUNNABLE (attempt ${i})"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Instance failed to become RUNNABLE (state: ${STATE})"
              exit 1
            fi
            sleep 5
          done

      # TODO: Remove after initial schema sync is complete
      - name: Reset database (one-time)
        run: |
          PROJECT=$(echo "${{ secrets.CLOUDSQL_CONNECTION_NAME }}" | cut -d: -f1)
          gcloud sql databases delete ${{ secrets.DB_NAME }} \
            --instance=${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
            --project="$PROJECT" --quiet || true
          gcloud sql databases create ${{ secrets.DB_NAME }} \
            --instance=${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
            --project="$PROJECT" --quiet

      - name: Update and execute Cloud Run Job
        run: |
          PROJECT=$(echo "${{ secrets.CLOUDSQL_CONNECTION_NAME }}" | cut -d: -f1)
          gcloud run jobs update db-migrate \
            --project="$PROJECT" \
            --region=${REGION} \
            --image=${IMAGE}:${{ github.sha }} \
            --quiet
          gcloud run jobs execute db-migrate \
            --project="$PROJECT" \
            --region=${REGION} \
            --wait \
            --quiet
