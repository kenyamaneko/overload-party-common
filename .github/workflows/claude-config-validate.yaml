name: Claude Config Validate

# claude/ 配下の変更を検証する。
# - skill frontmatter の必須項目 (name / description)
# - @import パスの参照先存在

on:
  push:
    branches: [main]
    paths:
      - "claude/**"
      - ".github/workflows/claude-config-validate.yaml"
  pull_request:
    paths:
      - "claude/**"
      - ".github/workflows/claude-config-validate.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill frontmatter
        run: |
          set -e
          python3 - <<'PY'
          import os, re, sys

          required_keys = {"name", "description"}
          errors = []
          for root, _, files in os.walk("claude"):
              if not root.endswith(os.sep + "skills"):
                  continue
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fp:
                      content = fp.read()
                  m = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
                  if not m:
                      errors.append(f"{path}: missing frontmatter")
                      continue
                  fm = m.group(1)
                  keys = set(re.findall(r"^(\w+):", fm, re.MULTILINE))
                  missing = required_keys - keys
                  if missing:
                      errors.append(f"{path}: missing frontmatter keys: {sorted(missing)}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("All skill frontmatter OK")
          PY

      - name: Validate @import paths
        run: |
          set -e
          python3 - <<'PY'
          import os, re, sys

          errors = []
          for root, _, files in os.walk("claude"):
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fp:
                      for i, line in enumerate(fp, 1):
                          if not line.startswith("@"):
                              continue
                          m = re.match(r"^@(\S+)", line)
                          if not m:
                              continue
                          imp = m.group(1)
                          base = os.path.dirname(path)
                          resolved = os.path.normpath(os.path.join(base, imp))
                          if not os.path.exists(resolved):
                              errors.append(f"{path}:{i}: @import target not found: {imp}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("All @import paths resolve")
          PY
