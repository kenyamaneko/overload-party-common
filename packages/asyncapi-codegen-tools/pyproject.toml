[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overload-party-asyncapi-codegen-tools"
version = "0.1.0"
description = "AsyncAPI 3.0 spec から Go 型を生成する共通 codegen ライブラリ"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "overload-party-codegen-tools",
]

[project.scripts]
asyncapi-codegen = "asyncapi_codegen_tools.runner:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
