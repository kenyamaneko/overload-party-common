[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overload-party-doc-tools"
version = "0.1.0"
description = "Overload Party ドキュメント自動生成ツール"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
generate-schema-doc = "doc_tools.generate_schema_doc:main"
generate-api-docs = "doc_tools.generate_api_docs:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
