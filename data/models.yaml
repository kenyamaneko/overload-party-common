# Model definitions for API contract types shared across repositories.
# generate_constants.py reads this file and outputs:
#   - packages/gamedata/model/*_gen.go  (Go structs, pkg: gamedata)
#   - packages/api/model/*_gen.go       (Go structs, pkg: api)
#   - packages/api-npm/src/models.ts      (TS interfaces, pkg: api)
#   - packages/api-npm/src/wsMessages.ts   (TS WS message types, pkg: api)
#
# target: "both" = gateway + battle, "gateway" = gateway only, "battle" = battle only
# pkg: "gamedata" = game design types, "api" = API contract types
# Fields: name (Go name), type (Go type string), json (json tag), db (optional db tag)

files:
  # ─── Deck ──────────────────────────────────────────────
  - name: deck
    target: both
    pkg: api
    imports:
      - encoding/json
      - time
    types:
      - name: PlayerCardWithDef
        comment: "PlayerCardWithDef is a PlayerCard enriched with card definition fields for API responses."
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: ArtNo, type: int64, json: "art_no"}
          - {name: Count, type: int, json: "count"}
          - {name: CardName, type: string, json: "card_name"}
          - {name: Faction, type: string, json: "faction"}
          - {name: CardType, type: string, json: "card_type"}
          - {name: Resizable, type: bool, json: "resizable"}
          - {name: Elastic, type: bool, json: "elastic"}
          - {name: Stats, type: json.RawMessage, json: "stats"}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty"}
          - {name: Restriction, type: string, json: "restriction"}

      - name: Deck
        comment: "Deck is the API response for a player's deck with optional card list."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: DeckID, type: int64, json: "deck_id"}
          - {name: DeckName, type: string, json: "deck_name"}
          - {name: IsValid, type: bool, json: "is_valid"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}
          - {name: DeckCards, type: "[]DeckCard", json: "deck_cards,omitempty", comment: "Populated by the service layer for API responses."}

      - name: DeckCard
        comment: "DeckCard is a single card entry within a deck."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: DeckID, type: int64, json: "deck_id"}
          - {name: CardID, type: string, json: "card_id"}
          - {name: ArtNo, type: int64, json: "art_no"}
          - {name: Count, type: int, json: "count"}

  # ─── Card ──────────────────────────────────────────────
  - name: card
    target: both
    pkg: gamedata
    imports:
      - encoding/json
      - time
    types:
      - name: CardDefinition
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: CardName, type: string, json: "card_name"}
          - {name: ResourceLabel, type: string, json: "resource_label"}
          - {name: Faction, type: string, json: "faction"}
          - {name: CardType, type: string, json: "card_type"}
          - {name: DeployTurns, type: int64, json: "deploy_turns"}
          - {name: Resizable, type: bool, json: "resizable"}
          - {name: Elastic, type: bool, json: "elastic"}
          - {name: ElasticIncrement, type: int64, json: "elastic_increment,omitempty"}
          - {name: FreeTier, type: int64, json: "free_tier,omitempty"}
          - {name: CostPerRequest, type: int64, json: "cost_per_request,omitempty"}
          - {name: Stats, type: json.RawMessage, json: "stats"}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty"}
          - {name: Effects, type: json.RawMessage, json: "effects,omitempty"}
          - {name: PassiveEffects, type: "[]PassiveEffect", json: "passive_effects,omitempty"}
          - {name: PlatformEffects, type: "[]PlatformEffect", json: "platform_effects,omitempty"}
          - {name: AttachmentEffects, type: "[]AttachmentEffect", json: "attachment_effects,omitempty"}
          - {name: Restriction, type: string, json: "restriction"}
          - {name: IsActive, type: bool, json: "is_active"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}

  # ─── Card Stats ────────────────────────────────────────
  - name: card_stats
    target: both
    pkg: gamedata
    types:
      - name: ComputeStats
        comment: "ComputeStats for Compute, Container, Orchestrator, Serverless, AI/ML card types."
        fields:
          - {name: Throughput, type: int64, json: "throughput"}
          - {name: ThroughputMax, type: "*int64", json: "throughput_max,omitempty"}
          - {name: Availability, type: int64, json: "availability"}
          - {name: MaintenanceCost, type: int64, json: "maintenance_cost"}
          - {name: SLAPenalty, type: int64, json: "sla_penalty"}

      - name: DataStats
        comment: "DataStats for Database, ObjectStorage, CacheDB card types."
        fields:
          - {name: Yield, type: int64, json: "yield"}
          - {name: YieldMax, type: "*int64", json: "yield_max,omitempty"}
          - {name: Availability, type: int64, json: "availability"}
          - {name: MaintenanceCost, type: int64, json: "maintenance_cost"}
          - {name: SLAPenalty, type: int64, json: "sla_penalty"}

  # ─── Passive / Platform / Attachment Effects ───────────
  - name: passive_effect
    target: both
    pkg: gamedata
    type_aliases:
      - {name: PassiveEffectType, base: string}
      - {name: PlatformEffectType, base: string}
      - {name: AttachmentEffectType, base: string}
    constants:
      - type: PassiveEffectType
        values:
          - {name: PassiveTPPerBackendDB, value: "tp_per_backend_db"}
          - {name: PassiveTPPerBackendData, value: "tp_per_backend_data"}
          - {name: PassiveTPIfCardTypeOnField, value: "tp_if_card_type_on_field"}
          - {name: PassiveYieldPerOtherDB, value: "dv_per_other_db"}
          - {name: PassiveYieldIfCardOnField, value: "dv_if_card_on_field"}
          - {name: PassiveAVBonus, value: "av_bonus"}
          - {name: PassiveScaleCostFree, value: "scale_cost_free"}
      - type: PlatformEffectType
        values:
          - {name: PlatformTPBonus, value: "tp_bonus"}
          - {name: PlatformYieldBonus, value: "yield_bonus"}
          - {name: PlatformAVBonus, value: "av_bonus"}
      - type: AttachmentEffectType
        values:
          - {name: AttachmentStatBonus, value: "stat_bonus"}
    types:
      - name: PassiveEffect
        fields:
          - {name: Type, type: PassiveEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: PlatformEffect
        fields:
          - {name: Type, type: PlatformEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: AttachmentEffect
        fields:
          - {name: Type, type: AttachmentEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: PassiveEffectConfig
        fields:
          - {name: Faction, type: string, json: "faction,omitempty"}
          - {name: CardTypes, type: "[]string", json: "card_types,omitempty"}
          - {name: BonusPerCard, type: int64, json: "bonus_per_card,omitempty"}
          - {name: FlatBonus, type: int64, json: "flat_bonus,omitempty"}
          - {name: MultiModelCardIDs, type: "[]string", json: "multi_model_card_ids,omitempty"}
          - {name: SpecificCardIDs, type: "[]string", json: "specific_card_ids,omitempty"}
          - {name: Zone, type: string, json: "zone,omitempty"}
          - {name: ExcludeSelf, type: bool, json: "exclude_self,omitempty"}

      - name: PlatformEffectConfig
        fields:
          - {name: TargetFaction, type: string, json: "target_faction,omitempty"}
          - {name: TargetCardTypes, type: "[]string", json: "target_card_types,omitempty"}
          - {name: Bonus, type: int64, json: "bonus,omitempty"}
          - {name: Reduction, type: int64, json: "reduction,omitempty"}
          - {name: ApplyToSelf, type: bool, json: "apply_to_self,omitempty"}

      - name: AttachmentEffectConfig
        fields:
          - {name: StatType, type: string, json: "stat_type"}
          - {name: Bonus, type: int64, json: "bonus"}

  # ─── WebSocket Messages (Gateway + Client) ─────────────
  # Shared message payloads for WebSocket communication.
  # Go: used as-is in handler/ws. TS: generated as interfaces.
  # ActionPerformedMessage is excluded (TS uses generics + ClientGameState).
  - name: ws_messages
    target: gateway
    pkg: api
    imports:
      - encoding/json
    types:
      # Client -> Server
      - name: MatchmakingStartMessage
        fields:
          - {name: DeckID, type: int64, json: "deck_id"}

      - name: GameEnterMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: DeckID, type: int64, json: "deck_id"}

      - name: NPCBattleStartMessage
        fields:
          - {name: DeckID, type: int64, json: "deck_id"}
          - {name: NPCModel, type: string, json: "npc_model"}

      - name: GameActionMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: ActionType, type: string, json: "action_type"}
          - {name: Data, type: json.RawMessage, json: "data"}

      - name: UseStampMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: StampNo, type: int64, json: "stamp_no"}

      # Server -> Client
      - name: ErrorMessage
        fields:
          - {name: Code, type: string, json: "error_code"}
          - {name: Message, type: string, json: "message"}
          - {name: Retryable, type: bool, json: "retryable"}

      - name: MatchFoundMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: Player1ID, type: string, json: "player1_id"}
          - {name: Player2ID, type: string, json: "player2_id"}

      - name: GameOverMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: WinnerNum, type: int64, json: "winner_num"}
          - {name: WinReason, type: string, json: "win_reason"}

      - name: ActionRejectedMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: ActionType, type: string, json: "action_type"}
          - {name: Reason, type: string, json: "reason"}

      - name: ActionPerformedMessage
        comment: "ActionPerformedMessage notifies a player of an action and the resulting state."
        fields:
          - {name: Sequence, type: int64, json: "sequence"}
          - {name: ActionType, type: string, json: "action_type"}
          - {name: ActionData, type: json.RawMessage, json: "action_data"}
          - {name: State, type: json.RawMessage, json: "state"}

      - name: StampUsedMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: StampNo, type: int64, json: "stamp_no"}

      - name: NPCBattleCreatedMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: Player1ID, type: string, json: "player1_id"}
          - {name: Player2ID, type: string, json: "player2_id"}

      # Spectate: Client -> Server
      - name: SpectateJoinMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}

      - name: SpectateLeaveMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}

      - name: SpectateStampMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: StampNo, type: int64, json: "stamp_no"}

      # Spectate: Server -> Client
      - name: SpectateJoinedMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: Player1ID, type: string, json: "player1_id"}
          - {name: Player2ID, type: string, json: "player2_id"}
          - {name: State, type: json.RawMessage, json: "state"}

      - name: SpectateErrorMessage
        fields:
          - {name: Code, type: string, json: "error_code"}
          - {name: Message, type: string, json: "message"}

      - name: SpectateEndedMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: WinnerNum, type: int64, json: "winner_num"}
          - {name: WinReason, type: string, json: "win_reason"}

      - name: SpectateStampBroadcastMessage
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: SpectatorID, type: string, json: "spectator_id"}
          - {name: StampNo, type: int64, json: "stamp_no"}

      # Opponent connection status (Server -> Client, no payload)
      - name: OpponentDisconnectedMessage
        fields: []

      - name: OpponentReconnectedMessage
        fields: []

  # ─── REST API (Gateway -> Client) ────────────────────────
  - name: rest_api
    target: gateway
    pkg: api
    imports:
      - encoding/json
      - time
    types:
      # ── Response types ──
      - name: PlayerResponse
        comment: "PlayerResponse is the API response for GET /player."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: FirebaseUID, type: string, json: "firebase_uid"}
          - {name: Username, type: string, json: "username"}
          - {name: Level, type: int64, json: "level"}
          - {name: Exp, type: int64, json: "exp"}
          - {name: IsPremium, type: bool, json: "is_premium"}
          - {name: EquippedIconNo, type: "*int64", json: "equipped_icon_no,omitempty"}
          - {name: SelectedFaction, type: "*string", json: "selected_faction,omitempty"}
          - {name: PremiumExpiresAt, type: "*time.Time", json: "premium_expires_at,omitempty"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}
          - {name: LevelExpCurrent, type: int64, json: "level_exp_current"}
          - {name: LevelExpRequired, type: int64, json: "level_exp_required"}

      - name: BattleLimitResponse
        comment: "BattleLimitResponse is the API response for GET /player/battle-limit."
        fields:
          - {name: DailyBattleCount, type: int64, json: "daily_battle_count"}
          - {name: DailyBattleLimit, type: int64, json: "daily_battle_limit"}
          - {name: CanBattle, type: bool, json: "can_battle"}

      - name: UserSettings
        comment: "UserSettings holds per-player application settings."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: Language, type: string, json: "language"}
          - {name: BgmVolume, type: int64, json: "bgm_volume"}
          - {name: SeVolume, type: int64, json: "se_volume"}
          - {name: PushEnabled, type: bool, json: "push_enabled"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}

      - name: ProductResponse
        comment: "ProductResponse is the API response for a purchasable item in the shop."
        fields:
          - {name: ProductID, type: string, json: "product_id"}
          - {name: Name, type: string, json: "name"}
          - {name: Type, type: string, json: "type"}
          - {name: Price, type: int64, json: "price"}
          - {name: Content, type: json.RawMessage, json: "content"}
          - {name: Description, type: "*string", json: "description,omitempty"}
          - {name: ImageURL, type: "*string", json: "image_url,omitempty"}
          - {name: IsActive, type: bool, json: "is_active"}
          - {name: IsOwned, type: bool, json: "is_owned"}

      - name: EpisodeWithStatus
        comment: "EpisodeWithStatus is the API response for a single episode with unlock status."
        fields:
          - {name: EpisodeID, type: string, json: "episode_id"}
          - {name: Faction, type: "*string", json: "faction"}
          - {name: EpisodeNumber, type: int64, json: "episode_number"}
          - {name: Title, type: string, json: "title"}
          - {name: ThumbnailURL, type: "*string", json: "thumbnail_url"}
          - {name: IsUnlocked, type: bool, json: "is_unlocked"}
          - {name: IsCompleted, type: bool, json: "is_completed"}
          - {name: LockReasons, type: "[]LockReason", json: "lock_reasons"}

      - name: LockReason
        comment: "LockReason describes a single unmet unlock condition for an episode."
        fields:
          - {name: Type, type: string, json: "type"}
          - {name: Required, type: "interface{}", json: "required"}
          - {name: Current, type: "interface{}", json: "current,omitempty"}

      - name: NewsArticle
        comment: "NewsArticle is the API response for a news article."
        fields:
          - {name: ArticleID, type: string, json: "article_id"}
          - {name: Source, type: string, json: "source"}
          - {name: Title, type: string, json: "title"}
          - {name: Summary, type: "*string", json: "summary,omitempty"}
          - {name: Tags, type: "[]string", json: "tags"}
          - {name: PublishedAt, type: "*time.Time", json: "published_at,omitempty"}
          - {name: FetchedAt, type: time.Time, json: "fetched_at"}

      - name: Announcement
        comment: "Announcement represents a single announcement entry."
        fields:
          - {name: ID, type: string, json: "id"}
          - {name: Title, type: string, json: "title"}
          - {name: Body, type: string, json: "body"}
          - {name: Type, type: string, json: "type"}
          - {name: PublishedAt, type: time.Time, json: "publishedAt"}
          - {name: ExpiresAt, type: time.Time, json: "expiresAt"}

      - name: DailyTip
        comment: "DailyTip represents a single daily tip entry."
        fields:
          - {name: ID, type: string, json: "id"}
          - {name: Text, type: string, json: "text"}

      - name: SpectateGameInfo
        comment: "SpectateGameInfo is the public view of an active game for the spectate list API."
        fields:
          - {name: GameID, type: string, json: "game_id"}
          - {name: Player1ID, type: string, json: "player1_id"}
          - {name: Player2ID, type: string, json: "player2_id"}
          - {name: StartedAt, type: time.Time, json: "started_at"}

      # ── Request types ──
      - name: DeckCardEntry
        comment: "DeckCardEntry represents a card entry in a deck create/update request."
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: ArtNo, type: int64, json: "art_no"}
          - {name: Count, type: int, json: "count"}

      - name: DeckCreateRequest
        comment: "DeckCreateRequest is the request body for POST /decks."
        fields:
          - {name: DeckName, type: string, json: "deck_name"}
          - {name: Cards, type: "[]DeckCardEntry", json: "cards"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty"}

      - name: DeckUpdateRequest
        comment: "DeckUpdateRequest is the request body for PUT /decks/:id."
        fields:
          - {name: DeckName, type: string, json: "deck_name"}
          - {name: Cards, type: "[]DeckCardEntry", json: "cards"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty"}

      - name: UpdateSettingsRequest
        comment: "UpdateSettingsRequest is the request body for PUT /player/settings."
        fields:
          - {name: Language, type: string, json: "language"}
          - {name: BgmVolume, type: int64, json: "bgm_volume"}
          - {name: SeVolume, type: int64, json: "se_volume"}
          - {name: PushEnabled, type: bool, json: "push_enabled"}

      - name: PurchaseRequest
        comment: "PurchaseRequest is the request body for POST /shop/purchase."
        fields:
          - {name: ProductID, type: string, json: "product_id"}
          - {name: Platform, type: string, json: "platform"}
          - {name: PurchaseToken, type: string, json: "purchase_token"}

  # ─── Game State View (Battle → Client) ─────────────────
  # JSON keys use C# ASP.NET CamelCase convention (first char lowercase).
  # Nullable pointer fields without omitempty are emitted as optional in TS
  # (C# serializes them with WhenWritingNull, so they may be absent).
  - name: game_state_view
    target: both
    pkg: gamedata
    go_skip: true
    nullable_as_optional: true
    imports:
      - time
    ts_imports:
      - {names: [AvailableAction], from: "./variantTypes"}
    types:
      - name: ClientGameState
        fields:
          - {name: GameID, type: string, json: "gameID"}
          - {name: CurrentTurn, type: int64, json: "currentTurn"}
          - {name: CurrentPhase, type: string, json: "currentPhase"}
          - {name: ActivePlayer, type: int64, json: "activePlayer"}
          - {name: IsMyTurn, type: bool, json: "isMyTurn"}
          - {name: TurnStartedAt, type: time.Time, json: "turnStartedAt"}
          - {name: MyView, type: PlayerView, json: "myView"}
          - {name: OppView, type: OpponentView, json: "oppView"}

      - name: PlayerView
        fields:
          - {name: PlayerNum, type: int64, json: "playerNum"}
          - {name: Budget, type: int64, json: "budget"}
          - {name: InsightPool, type: int64, json: "insightPool"}
          - {name: TimeBank, type: int64, json: "timeBank"}
          - {name: Field, type: Field, json: "field"}
          - {name: Hand, type: "[]UndeployedCard", json: "hand"}
          - {name: RepoCount, type: int, json: "repoCount"}
          - {name: TrashCount, type: int, json: "trashCount"}
          - {name: Trash, type: "[]UndeployedCard", json: "trash"}
          - {name: AvailableActions, type: "[]AvailableAction", json: "availableActions,omitempty"}

      - name: OpponentView
        fields:
          - {name: PlayerNum, type: int64, json: "playerNum"}
          - {name: Budget, type: int64, json: "budget"}
          - {name: InsightPool, type: int64, json: "insightPool"}
          - {name: TimeBank, type: int64, json: "timeBank"}
          - {name: Field, type: OpponentField, json: "field"}
          - {name: HandCount, type: int, json: "handCount"}
          - {name: RepoCount, type: int, json: "repoCount"}
          - {name: TrashCount, type: int, json: "trashCount"}
          - {name: Trash, type: "[]UndeployedCard", json: "trash"}

      - name: Field
        comment: "Field represents one player's complete field layout."
        fields:
          - {name: Frontend, type: "[]*DeployedResource", json: "frontend"}
          - {name: Backend, type: "[]*DeployedResource", json: "backend"}
          - {name: Support, type: "[]*DeployedSupport", json: "support"}

      - name: OpponentField
        comment: "Opponent's field with reactive cards hidden."
        fields:
          - {name: Frontend, type: "[]*DeployedResource", json: "frontend"}
          - {name: Backend, type: "[]*DeployedResource", json: "backend"}
          - {name: Support, type: "[]*HiddenDeployedSupport", json: "support"}

      - name: DeployedResource
        fields:
          - {name: InstanceID, type: string, json: "instanceID"}
          - {name: CardID, type: string, json: "cardID"}
          - {name: ArtNo, type: int64, json: "artNo"}
          - {name: Rank, type: "*string", json: "rank"}
          - {name: InstanceFamily, type: "*string", json: "instanceFamily"}
          - {name: FaceUp, type: bool, json: "faceUp"}
          - {name: DeployingTurnsLeft, type: int64, json: "deployingTurnsLeft"}
          - {name: CurrentAV, type: int64, json: "currentAV"}
          - {name: MaxAV, type: int64, json: "maxAV"}
          - {name: CurrentTP, type: "*int64", json: "currentTP"}
          - {name: MaxTP, type: "*int64", json: "maxTP"}
          - {name: CurrentYield, type: "*int64", json: "currentYield"}
          - {name: MaxYield, type: "*int64", json: "maxYield"}
          - {name: Damage, type: int64, json: "damage"}
          - {name: TemporaryEffects, type: "[]TemporaryEffect", json: "temporaryEffects"}
          - {name: MonetizedAmount, type: int64, json: "monetizedAmount"}
          - {name: HasAttacked, type: bool, json: "hasAttacked"}
          - {name: EffectUsedThisTurn, type: bool, json: "effectUsedThisTurn"}
          - {name: EffectUsedThisGame, type: bool, json: "effectUsedThisGame"}
