# Game design constants (SSoT).
#
# Rules of the game — shared across ALL runtime services and client.
# Owned by common (no runtime service owns these; they are game design itself).
#
# Faction constants are sourced separately from data/factions.yaml.
#
# Consumed by scripts/generate_constants.py → packages/game-design-constants/
#                                            → packages/game-design-constants-dotnet/
#                                            → packages/game-design-constants-npm/src/index.ts

zones:
- frontend
- backend
- support

ranks:
- small
- medium
- large

instance_families:
- M
- C
- R

card_types:
  compute:
  - Compute
  - Container
  - Orchestrator
  - Serverless
  - AI/ML
  data:
  - Database
  - ObjectStorage
  - CacheDB
  support:
  - Platform
  - Attachment
  - Strategy
  - Reactive
  - Incident
  log:
  - Log

# 新しい3階層分類（Zone / CardCategory / Subtype）。段階移行中のため
# 上の旧 card_types とは並存する。移行完了後に card_types を削除し、
# card_categories を CardTypes にリネームする。
# 参考: memory/project_card_taxonomy.md
card_categories:
- Compute
- Data
- Platform
- Attachment
- Strategy
- Reactive
- Incident

# Subtype を持つ CardCategory のみ列挙する（Compute / Data）。
# 旧 CardTypes では個別 "Compute" と category "Compute" が同名衝突していたため、
# 個別側は VM にリネームする。
card_subtypes:
  Compute:
  - VM
  - Container
  - Orchestrator
  - Serverless
  - AI/ML
  Data:
  - Database
  - ObjectStorage
  - CacheDB

restriction_values:
- unlimited
- limited
- semi_limited
- forbidden

match_types:
- pvp
- npc

stat_types:
- tp
- yield
- av

initial_values:
  # deck_size は gateway / battle / client の 3 リポジトリから静的に参照されるため
  # パッケージ定数として配信する。その他のゲーム定数は game_config テーブルで管理。
  deck_size: 30
