# Game design constants (SSoT).
#
# Rules of the game — shared across ALL runtime services and client.
# Owned by common (no runtime service owns these; they are game design itself).
#
# Faction constants are sourced separately from data/factions.yaml.
#
# Consumed by scripts/generate_constants.py → packages/game-design-constants/
#                                            → packages/game-design-constants-dotnet/
#                                            → packages/game-design-constants-npm/src/index.ts

zones:
- frontend
- backend
- support

ranks:
- small
- medium
- large

instance_families:
- M
- C
- R

# Zone / CardType / Subtype の 3 階層分類。
# Subtype を持つのは Compute と DataResource のみ。
# 旧 CardTypes では個別 "Compute" と category "Compute" が同名衝突していたため
# 個別側は VM にリネーム済み。
card_types:
- Compute
- DataResource
- Platform
- Attachment
- Strategy
- Reactive
- Incident

subtypes:
  Compute:
  - VM
  - Container
  - Orchestrator
  - Serverless
  - AI/ML
  DataResource:
  - Database
  - ObjectStorage
  - CacheDB

restriction_values:
- unlimited
- limited
- semi_limited
- forbidden

# 制限区分ごとのデッキ投入上限枚数。restriction_values の全値を網羅すること。
restriction_copy_count:
  unlimited: 3
  limited: 1
  semi_limited: 2
  forbidden: 0

match_types:
- pvp
- npc

stat_types:
- tp
- yield
- av

initial_values:
  # deck_size は gateway / battle / client の 3 リポジトリから静的に参照されるため
  # パッケージ定数として配信する。運営チューニング値は Firestore game_config コレクションで管理。
  # 配置ルールの SSoT: docs/architecture/DATA_DESIGN.md#定数設定値の配置ルール
  deck_size: 30
