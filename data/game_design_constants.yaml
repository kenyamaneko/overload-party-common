# Game design constants (SSoT).
#
# Rules of the game — shared across ALL runtime services and client.
# Owned by common (no runtime service owns these; they are game design itself).
#
# Faction constants are sourced separately from data/factions.yaml.
#
# Consumed by scripts/generate_constants.py → packages/game-design-constants/
#                                            → packages/game-design-constants-dotnet/
#                                            → packages/game-design-constants-npm/src/index.ts

zones:
- frontend
- backend
- support

ranks:
- small
- medium
- large

instance_families:
- M
- C
- R

# Zone / CardType / Subtype の 3 階層分類。
# Subtype を持つのは Compute と Data のみ。
# 旧 CardTypes では個別 "Compute" と category "Compute" が同名衝突していたため
# 個別側は VM にリネーム済み。参考: memory/project_card_taxonomy.md
card_types:
- Compute
- Data
- Platform
- Attachment
- Strategy
- Reactive
- Incident

subtypes:
  Compute:
  - VM
  - Container
  - Orchestrator
  - Serverless
  - AI/ML
  Data:
  - Database
  - ObjectStorage
  - CacheDB

restriction_values:
- unlimited
- limited
- semi_limited
- forbidden

match_types:
- pvp
- npc

stat_types:
- tp
- yield
- av

initial_values:
  # deck_size は gateway / battle / client の 3 リポジトリから静的に参照されるため
  # パッケージ定数として配信する。その他のゲーム定数は game_config テーブルで管理。
  deck_size: 30
