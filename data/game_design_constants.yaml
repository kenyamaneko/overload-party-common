# Game design constants (SSoT).
#
# Rules of the game — shared across ALL runtime services and client.
# Owned by common (no runtime service owns these; they are game design itself).
#
# Faction constants are sourced separately from data/factions.yaml.
#
# Consumed by scripts/generate_constants.py → packages/game-design-constants/
#                                            → packages/game-design-constants-dotnet/
#                                            → packages/game-design-constants-npm/src/index.ts

zones:
- frontend
- backend
- support

ranks:
- small
- medium
- large

instance_families:
- M
- C
- R

# Zone / CardType / Subtype の 3 階層分類。
# Subtype を持つのは Compute と DataResource のみ。
# 旧 CardTypes では個別 "Compute" と category "Compute" が同名衝突していたため
# 個別側は VM にリネーム済み。
card_types:
- Compute
- DataResource
- Platform
- Attachment
- Strategy
- Reactive
- Incident

subtypes:
  Compute:
  - VM
  - Container
  - Orchestrator
  - Serverless
  - AI/ML
  DataResource:
  - Database
  - ObjectStorage
  - CacheDB

# カードテキストが使うリソースの括り。カード定義には subtype を列挙させず
# この名前で指定させることで、subtype が増えたときの取りこぼしを防ぐ。
# card_type と一致する括りは card_type で、部分集合になる括りは subtypes で表す。
resource_groups:
  compute:
    card_type: Compute
  db:
    subtypes:
    - Database
    - CacheDB

restriction_values:
- unlimited
- limited
- semi_limited
- forbidden

# 制限区分ごとのデッキ投入上限枚数。restriction_values の全値を網羅すること。
restriction_copy_count:
  unlimited: 3
  limited: 1
  semi_limited: 2
  forbidden: 0

match_types:
- pvp
- npc

stat_types:
- tp
- yield
- av

initial_values:
  # deck_size は gateway / battle / client の 3 リポジトリから静的に参照されるため
  # パッケージ定数として配信する。運営チューニング値は Firestore game_config コレクションで管理。
  # 配置ルールの SSoT: docs/architecture/DATA_DESIGN.md#定数設定値の配置ルール
  deck_size: 30
  initial_budget: 5000
  initial_insight_pool: 0
  initial_hand_size: 5

game_rules:
  hand_limit: 6
  slots_per_zone: 3
  max_turns: 30
  launch_failure_turn: 3
  max_attachments_per_resource: 2

# Resizable ランクに応じたステータス倍率。
rank_multipliers:
  small: 1
  medium: 2
  large: 3

# stat はスループット/Yield 系倍率、av は可用性倍率。
family_multipliers:
  M: { stat: 1.0, av: 1.0 }
  C: { stat: 1.3, av: 0.7 }
  R: { stat: 0.7, av: 1.3 }
